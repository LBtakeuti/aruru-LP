<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0">
  <title>ヒーローセクション | 洗濯機クリーニング</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #fff;
    }

    /* ===== メインコンテナ ===== */
    .hero-section {
      position: relative;
      width: 375px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
    }

    /* ===== 背景画像 ===== */
    .hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ===== 上部CTA + 情報バー ===== */
    .top-section {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* CTAボタン（section-14 パターン3：赤→オレンジグラデ） */
    .cta-pattern3-button {
      width: 336px;
      height: 80px;
      background: linear-gradient(to right, #ff4542 0.637%, #ffac00 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-right: 15px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .cta-pattern3-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 8px 0;
    }

    .cta-pattern3-title {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 700;
      font-size: 22px;
      line-height: 20px;
      color: #fff;
      text-align: center;
      white-space: nowrap;
    }

    .cta-pattern3-badge {
      background-color: #ffe500;
      border-radius: 4px;
      padding: 6px 41px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cta-pattern3-badge-text {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 700;
      font-size: 16px;
      line-height: 16px;
      color: #c74000;
      text-align: center;
      width: 149px;
    }

    /* ===== 情報バー（SVG使用） ===== */
    .info-bar {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-bar img {
      display: block;
    }

    /* ===== コンテンツエリア ===== */
    .content-area {
      position: relative;
      z-index: 10;
      width: 335px;
      padding-bottom: 328px;
    }

    /* スタッフ + バッジ */
    .person-badge-area {
      position: relative;
      display: flex;
      align-items: flex-start;
      width: 100%;
      height: 505px;
      padding-right: 91px;
      margin-bottom: -328px;
    }

    .badge-wrap {
      position: relative;
      z-index: 5;
      margin-right: -91px;
    }

    .badge-wrap img {
      width: 176px;
      height: 74px;
      object-fit: contain;
    }

    .staff-wrap {
      position: relative;
      width: 308px;
      height: 425px;
      margin-right: -91px;
    }

    .staff-wrap img {
      position: absolute;
      top: -6.64%;
      left: 0;
      width: 111.22%;
      height: 113.27%;
      max-width: none;
      object-fit: cover;
    }

    /* メインコピーエリア */
    .main-copy-area {
      position: relative;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: -328px;
    }

    .main-copy-img {
      width: 342px;
      height: 148.091px;
      overflow: hidden;
    }

    .main-copy-img img {
      width: 100%;
      height: 100.31%;
      margin-top: -0.16%;
      max-width: none;
      object-fit: contain;
    }

    .before-after-img {
      width: 342px;
      height: 222.5px;
    }

    .before-after-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ===== 料金エリア（SVG使用） ===== */
    .price-area {
      position: relative;
      z-index: 20;
      width: 336px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .price-area img {
      display: block;
    }
  </style>
</head>
<body>
  <section class="hero-section">
    <!-- 背景画像 -->
    <div class="hero-bg">
      <img src="section-02-assets/065525e53d81cc1c74f9c1695ebda87545eea654.png" alt="">
    </div>

    <!-- 上部セクション：LINE CTA + 情報バー -->
    <div class="top-section">
      <!-- CTAボタン（section-14 パターン3） -->
      <a href="#" class="cta-pattern3-button">
        <div class="cta-pattern3-inner">
          <p class="cta-pattern3-title">無料分解診断を予約</p>
          <div class="cta-pattern3-badge">
            <span class="cta-pattern3-badge-text">こちらをクリック</span>
          </div>
        </div>
      </a>

      <!-- 情報バー（Figma SVGエクスポート）-->
      <div class="info-bar">
        <img src="section-02-assets/H1.1.svg" alt="最短3日対応 | 訪問・分解0円" width="302" height="36">
      </div>
    </div>

    <!-- コンテンツエリア -->
    <div class="content-area">
      <!-- スタッフ + バッジ -->
      <div class="person-badge-area">
        <div class="badge-wrap">
          <img src="section-02-assets/b8f6b0addbef49bedba8c52fdd64a1bb1a3bfefd.png" alt="17年の実績 × ベテラン作業員の確かな技術">
        </div>
        <div class="staff-wrap">
          <img src="section-02-assets/c7c8da96ab65ad993af831a1fc1c35cd6507355a.png" alt="スタッフ">
        </div>
      </div>

      <!-- メインコピーエリア -->
      <div class="main-copy-area">
        <div class="main-copy-img">
          <img src="section-02-assets/7be46e3db041e1e4da71c006639c9d4f5dcfa98c.png" alt="家電を知り尽くしたプロが行う洗濯機クリーニング">
        </div>
        <div class="before-after-img">
          <img src="section-02-assets/9cc0131c2b6d43aa77b0c3df5d52727f89efd6ec.png" alt="Before After">
        </div>
      </div>
    </div>

    <!-- 料金エリア（Figma SVGエクスポート）-->
    <div class="price-area">
      <img src="section-02-assets/H1.2.svg" alt="業界最安級 縦型¥4,800〜" width="336" height="113">
    </div>

  </section>
</body>
</html>
