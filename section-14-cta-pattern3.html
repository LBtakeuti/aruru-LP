<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0">
  <title>CTAボタン パターン3 | 洗濯機クリーニング</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #fff;
    }

    /* ===== CTAボタン パターン3 ===== */
    .cta-pattern3-section {
      width: 375px;
      height: 112px;
      margin: 0 auto;
      background-color: #e5f4fc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 0;
    }

    .cta-pattern3-button {
      width: 336px;
      height: 80px;
      background: linear-gradient(
        to right,
        #ff4542 0.637%,
        #ffac00 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-right: 15px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .cta-pattern3-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 8px 0;
    }

    .cta-pattern3-title {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 700;
      font-size: 22px;
      line-height: 20px;
      color: #fff;
      text-align: center;
      white-space: nowrap;
    }

    .cta-pattern3-badge {
      background-color: #ffe500;
      border-radius: 4px;
      padding: 6px 41px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cta-pattern3-badge-text {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 700;
      font-size: 16px;
      line-height: 16px;
      color: #c74000;
      text-align: center;
      width: 149px;
    }
  </style>
</head>
<body>
  <section class="cta-pattern3-section">
    <a href="#" class="cta-pattern3-button">
      <div class="cta-pattern3-inner">
        <p class="cta-pattern3-title">無料分解診断を予約</p>
        <div class="cta-pattern3-badge">
          <span class="cta-pattern3-badge-text">こちらをクリック</span>
        </div>
      </div>
    </a>
  </section>
</body>
</html>
